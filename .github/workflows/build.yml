name: build-reflux

on:
  push:
    branches: [ "master" ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Collect metadata
        id: meta
        run: |
          $sha  = git rev-parse --short HEAD
          $ver  = (Get-Content Reflux/offsets.txt -TotalCount 1).Trim()
          $date = ($ver -split ':')[-1]
          "sha=$sha"   >> $env:GITHUB_OUTPUT
          "ver=$ver"   >> $env:GITHUB_OUTPUT
          "date=$date" >> $env:GITHUB_OUTPUT

      - name: Publish
        run: >
          dotnet publish Reflux/Reflux.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -o publish

      - name: Bundle
        run: |
          Copy-Item LICENSE publish/
          Compress-Archive -Path publish/* `
            -DestinationPath "Reflux-${{ steps.meta.outputs.date }}-${{ steps.meta.outputs.sha }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: reflux-${{ steps.meta.outputs.date }}-${{ steps.meta.outputs.sha }}
          path: publish
          retention-days: 30

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.meta.outputs.date }}-${{ steps.meta.outputs.sha }}
          target_commitish: ${{ github.sha }}
          name: Reflux (${{ steps.meta.outputs.ver }})
          body: |
            source: `${{ github.repository }}` @ `${{ github.ref_name }}` (`${{ steps.meta.outputs.sha }}`)
            offsets: `${{ steps.meta.outputs.ver }}`

            Built from https://github.com/olji/Reflux (MIT)
          files: '*.zip'
